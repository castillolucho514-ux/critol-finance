services:
  frontend:
    build: { context: .., dockerfile: docker/frontend.Dockerfile }
    ports: ["3000:3000"]
    environment: { NEXT_PUBLIC_API_URL: http://localhost:4000 }
    depends_on: [backend]
  backend:
    build: { context: .., dockerfile: docker/backend.Dockerfile }
    ports: ["4000:4000"]
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-critol}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-critol}"
      REDIS_URL: "redis://redis:6379"
      WEB_ORIGIN: "http://localhost:3000"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set}"
    depends_on: [postgres, redis]
  postgres:
    build: { context: .., dockerfile: docker/postgres.Dockerfile }
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-critol}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      POSTGRES_DB: "${POSTGRES_DB:-critol}"
    volumes: [postgres-data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
volumes:
  postgres-data:
